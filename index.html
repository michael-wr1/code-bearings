<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2ec">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23934228' d='M16 2 21 11 30 16 21 21 16 30 11 21 2 16 11 11Z'/%3E%3C/svg%3E">
    <title>Code Bearings — repository quiz viewer</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="app-header">
      <div class="brand">
        <svg aria-hidden="true" viewBox="0 0 40 40" width="36" height="36">
          <circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M20 4v5m0 22v5M4 20h5m22 0h5" stroke="currentColor" stroke-width="1.4"/>
          <path d="m26 12-3 11-9 5 3-11z" fill="currentColor"/>
          <circle cx="20" cy="20" r="2" fill="var(--paper)"/>
        </svg>
        <span>Code Bearings</span>
      </div>
      <div class="header-actions">
        <button id="open-package" class="button secondary" type="button">Open quiz package</button>
        <input id="package-file" type="file" accept=".json,application/json" aria-label="Choose a quiz package" hidden>
      </div>
    </header>
    <div id="import-notice" class="import-notice" role="alert" tabindex="-1" hidden></div>
    <div id="announcements" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="app"></div>
    <dialog id="confirmation" aria-labelledby="confirmation-title" aria-describedby="confirmation-description"></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
