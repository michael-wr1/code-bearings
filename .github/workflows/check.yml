name: Checks and downloads

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install from the lockfile without an existing npm cache
        run: npm ci --cache "$RUNNER_TEMP/code-bearings-npm-cache"
      - run: npm test
      - run: npm run test:skill
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build release candidates
        if: matrix.node == '24.x'
        run: npm run build:release
      - name: Test extracted downloads
        if: matrix.node == '24.x'
        run: npm run test:release
      - name: Upload tested downloads
        if: matrix.node == '24.x'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads-${{ github.sha }}
          path: .release/*
          # Packaging and archive checks allowlist this directory's contents.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
